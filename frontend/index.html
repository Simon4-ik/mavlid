<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover">
  <title>Мавлид ан-Набий — Китобхон</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="app-container" id="app">
    
    <!-- Header Toolbar -->
    <header class="app-header" id="app-header">
      <div class="header-inner">
        <div class="book-title-wrapper" id="btn-open-toc" title="Мундарижа">
          <span class="book-badge">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2l2.4 7.4h7.6l-6 4.6 2.3 7-6.3-4.6-6.3 4.6 2.3-7-6-4.6h7.6z"/>
            </svg>
            Мавлид ан-Набий
          </span>
          <h1 class="book-title">Мавлид китоби</h1>
        </div>

        <div class="header-actions">
          <!-- Bookmark button -->
          <button class="icon-btn" id="btn-bookmark" title="Хатчўп (Закладка)" aria-label="Закладка">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
            </svg>
          </button>

          <!-- Bookmarks list modal button -->
          <button class="icon-btn" id="btn-open-bookmarks" title="Хатчўплар рўйхати" aria-label="Хатчўплар">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
          </button>

          <!-- Theme modal button -->
          <button class="icon-btn" id="btn-theme-modal" title="Ранг мавзуси" aria-label="Тема">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
            </svg>
          </button>

          <!-- Fullscreen toggle -->
          <button class="icon-btn" id="btn-fullscreen" title="Тўлиқ экран" aria-label="Тўлиқ экран">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Reader Main Viewport -->
    <main class="reader-viewport" id="viewport">
      <!-- Loading Overlay -->
      <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loading-text">Мавлид китоби юкланмоқда...</div>
      </div>

      <!-- Tap Zones for Touch Navigation -->
      <div class="tap-zone left" id="tap-prev" title="Олдинги саҳифа"></div>
      <div class="tap-zone center" id="tap-toggle" title="Панелни очиш/ёпиш"></div>
      <div class="tap-zone right" id="tap-next" title="Кейинги саҳифа"></div>

      <!-- Book Page Wrapper -->
      <div class="canvas-wrapper" id="canvas-wrapper">
        <img id="page-image" src="/static/pages/page_1.webp" alt="Саҳифа 1" draggable="false">
      </div>

      <!-- Floating Page Indicator Pill -->
      <div class="page-pill" id="page-pill">1 / 24</div>
    </main>

    <!-- Footer Controls -->
    <footer class="app-footer" id="app-footer">
      <div class="footer-inner">
        <!-- Scrubber Row -->
        <div class="scrubber-row">
          <span class="page-count-label" id="current-page-num">1</span>
          <div class="slider-container">
            <input type="range" id="page-slider" class="page-slider" min="1" max="24" value="1" step="1" aria-label="Саҳифани танлаш">
          </div>
          <span class="page-count-label" id="total-pages-count">24</span>
        </div>

        <!-- Navigation Buttons Row -->
        <div class="controls-row">
          <button class="nav-btn" id="btn-prev" aria-label="Олдинги саҳифа">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span>Олдинги</span>
          </button>

          <div class="page-quick-jump" id="btn-jump-modal" title="Саҳифага сакраш">
            <span id="jump-label">Саҳифа 1 / 24</span>
          </div>

          <button class="nav-btn" id="btn-next" aria-label="Кейинги саҳифа">
            <span>Кейинги</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </footer>

    <!-- Modal: Jump to Page / Table of Contents -->
    <div class="modal-backdrop" id="modal-jump">
      <div class="modal-sheet">
        <div class="modal-header">
          <h2 class="modal-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            Саҳифани танлаш
          </h2>
          <button class="modal-close-btn" data-close="modal-jump">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="page-grid" id="page-grid">
            <!-- Dynamically generated 24 page tiles -->
          </div>
        </div>
      </div>
    </div>

    <!-- Modal: Bookmarks -->
    <div class="modal-backdrop" id="modal-bookmarks">
      <div class="modal-sheet">
        <div class="modal-header">
          <h2 class="modal-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
            </svg>
            Сақланган хатчўплар
          </h2>
          <button class="modal-close-btn" data-close="modal-bookmarks">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="bookmarks-list" id="bookmarks-list">
            <!-- Dynamic bookmarks -->
          </div>
        </div>
      </div>
    </div>

    <!-- Modal: Themes & Settings -->
    <div class="modal-backdrop" id="modal-themes">
      <div class="modal-sheet">
        <div class="modal-header">
          <h2 class="modal-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            Ўқиш созламалари
          </h2>
          <button class="modal-close-btn" data-close="modal-themes">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 8px;">Ранг мавзуси (кўз учун қулайлик):</p>
          <div class="theme-options">
            <div class="theme-chip active" data-theme-val="dark">
              <span>🌙 Тунги</span>
              <span style="font-size: 11px; opacity: 0.7;">Dark OLED</span>
            </div>
            <div class="theme-chip" data-theme-val="sepia">
              <span>📜 Сепия</span>
              <span style="font-size: 11px; opacity: 0.7;">Иссиқ қоғоз</span>
            </div>
            <div class="theme-chip" data-theme-val="light">
              <span>☀️ Кундузги</span>
              <span style="font-size: 11px; opacity: 0.7;">Оқ фон</span>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="/static/app.js"></script>
</body>
</html>
